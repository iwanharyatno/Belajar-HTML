<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes Favorit</title>
    
    <style>
        body {
            font-family: sans-serif;
            padding: 0;
            margin: 0;
        }

        h1 {
            background-color: brown;
            margin: 0;
            padding: 20px;
            color: white;
            text-align: center;
            margin-bottom: 24px;
        }

        .quotes-card {
            width: 300px;
            background-color: bisque;
            text-align: center;
            padding: 18px;
            margin: 12px auto;
            border-radius: 12px;
            box-shadow: 0 0 8px black;
        }

        .quotes-img {
            width: 80px;
            border-radius: 50%;
        }

        .quotes-text {
            font-family: monospace;
        }

        .quotes-from {
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .quotes-movie {
            margin-top: 0;
        }
    </style>

</head>
<body>
    <h1>Quotes Favorit</h1>

    <div class="quotes-card">
        <img 
            class="quotes-img"
            src="media/quotes/master-oogway.jpg" alt="">
        <blockquote class="quotes-text">
            "Yesterday is a history,
            tommorrow is a mystery but today is a gift,
            that's why it's called the present.
        </blockquote>
        <p class="quotes-from">Grand Master Oogway</p>
        <p class="quotes-movie">Kung-Fu Panda</p>
    </div>
</body>
</html>
