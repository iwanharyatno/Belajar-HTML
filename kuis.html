<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Matematika</title>

    <style>
        body {
            background-color: rgb(255, 244, 223);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .form-utama {
            width: 600px;
            margin: auto;
        }
        .form-cover {
            background-color: brown;
            color: white;
            padding: 24px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 18px;
        }
        .form-card {
            background-color: white;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .form-label, .form-input {
            display: block;
        }
        .form-label {
            margin-bottom: 14px;
        }
        .form-input {
            border: none;
            outline: none;
            background-color: transparent;
            border-bottom: 1px solid gray;
            padding: 8px 0;
            width: 100%;
        }
        .form-input:focus {
            border-bottom: 2px solid brown;
        }

        input[type="radio"] {
            accent-color: brown;
        }
    </style>
</head>
<body>
    <form action="" class="form-utama">
        <div class="form-cover">
            <h1>Ulangan Harian Matematika</h1>
        </div>

        <div class="form-card">
            <label for="nama_lengkap" class="form-label">Nama Lengkap:</label>
            <input type="text" id="nama_lengkap" class="form-input">
        </div>

        <div class="form-card">
            <label for="no_absen" class="form-label">No Absen:</label>
            <input type="number" id="no_absen" class="form-input">
        </div>

        <div class="form-card">
            <p>1. Hasil dari 10<sup>3</sup> adalah...</p>
            <input type="radio" id="soal1_a" name="soal1">
            <label for="soal1_a">3000</label><br>

            <input type="radio" id="soal1_b" name="soal1">
            <label for="soal1_b">1000</label><br>

            <input type="radio" id="soal1_c" name="soal1">
            <label for="soal1_c">4000</label><br>

            <input type="radio" id="soal1_d" name="soal1">
            <label for="soal1_d">5000</label><br>
        </div>

        <div class="form-card">
            <p>2. Hasil dari 10<sup>3</sup> adalah...</p>
            <input type="radio" id="soal2_a" name="soal2">
            <label for="soal2_a">3000</label><br>

            <input type="radio" id="soal2_b" name="soal2">
            <label for="soal2_b">1000</label><br>

            <input type="radio" id="soal2_c" name="soal2">
            <label for="soal2_c">4000</label><br>

            <input type="radio" id="soal2_d" name="soal2">
            <label for="soal2_d">5000</label><br>
        </div>
    </form>
</body>
</html>
